  <image href="../photos/mengdi-wang.jpeg" x="94" y="1334" width="112" height="112" preserveAspectRatio="xMidYMin slice" clip-path="url(#o1)"/><image href="../photos/le-song.jpg" x="274" y="1334" width="112" height="112" preserveAspectRatio="xMidYMin slice" clip-path="url(#o2)"/><image href="../photos/masatoshi-uehara.jpg" x="454" y="1334" width="112" height="112" preserveAspectRatio="xMidYMin slice" clip-path="url(#o3)"/><image href="../photos/xiner-li.png" x="620" y="1320" width="140" height="140" preserveAspectRatio="xMidYMin slice" clip-path="url(#o4)"/><image href="../photos/ehsan-hajiramezanali.png" x="814" y="1334" width="112" height="112" preserveAspectRatio="xMidYMin slice" clip-path="url(#o5)"/><image href="../photos/philipp-schaefer.jpg" x="994" y="1334" width="112" height="112" preserveAspectRatio="xMidYMin slice" clip-path="url(#o6)"/>
  <g text-anchor="middle"><text x="150" y="1465" class="name">Mengdi Wang</text><text x="330" y="1465" class="name">Le Song</text><text x="510" y="1465" class="name">Masatoshi Uehara</text><text x="690" y="1465" class="name">Xiner Li</text><text x="870" y="1465" class="name">Ehsan Hajiramezanali</text><text x="1050" y="1465" class="name">Philipp Schäfer</text></g>


<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.navy{fill:#0c2941}.teal{fill:#087d83}.muted{fill:#496878}
      .caps{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:3px}.title{font-family:Georgia,'Times New Roman',serif;font-weight:700}
      .section{font-family:Georgia,'Times New Roman',serif;font-size:31px;font-weight:700;fill:#0c2941}.name{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#0c2941}.aff{font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#496878}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0c2941" flood-opacity=".12"/></filter>
    <clipPath id="p1"><circle cx="118" cy="1110" r="57"/></clipPath><clipPath id="p2"><circle cx="278" cy="1110" r="57"/></clipPath>
    <clipPath id="p3"><circle cx="438" cy="1110" r="57"/></clipPath><clipPath id="p4"><circle cx="598" cy="1110" r="57"/></clipPath>
    <clipPath id="p5"><circle cx="758" cy="1110" r="57"/></clipPath><clipPath id="p6"><circle cx="918" cy="1110" r="57"/></clipPath>
    <clipPath id="p7"><circle cx="1078" cy="1110" r="57"/></clipPath>
    <clipPath id="o1"><circle cx="150" cy="1390" r="52"/></clipPath><clipPath id="o2"><circle cx="330" cy="1390" r="52"/></clipPath>
    <clipPath id="o3"><circle cx="510" cy="1390" r="52"/></clipPath><clipPath id="o4"><circle cx="690" cy="1378" r="52"/></clipPath>
    <clipPath id="o5"><circle cx="870" cy="1390" r="52"/></clipPath><clipPath id="o6"><circle cx="1050" cy="1390" r="52"/></clipPath>
  </defs>
  <rect width="1200" height="1600" fill="#f8fdff"/>
  <image href="agenticls-background.png" width="1200" height="1600" preserveAspectRatio="xMidYMid slice" opacity=".72"/>

  <rect x="55" y="48" width="1090" height="338" rx="34" fill="#ffffff" fill-opacity=".91" filter="url(#shadow)"/>
  <rect x="250" y="64" width="700" height="48" rx="24" fill="#087d83"/>
  <text x="600" y="96" text-anchor="middle" class="caps" fill="#ffffff" font-size="23">NEURIPS 2026 WORKSHOP · SYDNEY</text>
  <text x="600" y="166" text-anchor="middle" class="title navy" font-size="52">Agentic AI for</text>
  <text x="600" y="220" text-anchor="middle" class="title navy" font-size="52">Biological Discovery</text>
  <text x="600" y="262" text-anchor="middle" class="sans teal" font-size="24" font-weight="700">AgenticLS</text>
  <text x="600" y="300" text-anchor="middle" class="sans muted" font-size="19">From scientific copilots to closed-loop laboratories</text>
  <line x1="265" y1="327" x2="935" y2="327" stroke="#40b9c7" stroke-width="2"/>
  <text x="600" y="358" text-anchor="middle" class="caps navy" font-size="18">DECEMBER 11 OR 12, 2026 · SYDNEY, AUSTRALIA</text>

  <rect x="55" y="416" width="755" height="504" rx="25" fill="#ffffff" fill-opacity=".94" stroke="#8bd2db"/>
  <text x="88" y="462" class="section">Topics of interest</text>
  <text x="88" y="488" class="sans muted" font-size="15">We welcome agent and LLM research across the breadth of life science, including:</text>
  <g class="sans navy" font-size="15">
    <rect x="88" y="510" width="334" height="45" rx="11" fill="#e4f7f8"/><text x="105" y="538">LLM agents &amp; scientific copilots</text>
    <rect x="443" y="510" width="334" height="45" rx="11" fill="#eaf3fb"/><text x="460" y="538">Agent architectures &amp; multi-agent systems</text>
    <rect x="88" y="566" width="334" height="45" rx="11" fill="#eaf3fb"/><text x="105" y="594">Reasoning, planning, memory &amp; tool use</text>
    <rect x="443" y="566" width="334" height="45" rx="11" fill="#e4f7f8"/><text x="460" y="594">RAG, knowledge graphs &amp; literature agents</text>
    <rect x="88" y="622" width="334" height="45" rx="11" fill="#e4f7f8"/><text x="105" y="650">Multimodal agents for scientific data</text>
    <rect x="443" y="622" width="334" height="45" rx="11" fill="#eaf3fb"/><text x="460" y="650">Protein, genome &amp; single-cell models</text>
    <rect x="88" y="678" width="334" height="45" rx="11" fill="#eaf3fb"/><text x="105" y="706">Generalist vs. biology-specialized models</text>
    <rect x="443" y="678" width="334" height="45" rx="11" fill="#e4f7f8"/><text x="460" y="706">Hypothesis generation &amp; evidence synthesis</text>
    <rect x="88" y="734" width="334" height="45" rx="11" fill="#e4f7f8"/><text x="105" y="762">Molecule, protein &amp; sequence design</text>
    <rect x="443" y="734" width="334" height="45" rx="11" fill="#eaf3fb"/><text x="460" y="762">Drug discovery &amp; therapeutic development</text>
    <rect x="88" y="790" width="334" height="45" rx="11" fill="#eaf3fb"/><text x="105" y="818">Lab automation, robotics &amp; closed loops</text>
    <rect x="443" y="790" width="334" height="45" rx="11" fill="#e4f7f8"/><text x="460" y="818">RL, feedback &amp; recursive improvement</text>
    <rect x="88" y="846" width="334" height="45" rx="11" fill="#e4f7f8"/><text x="105" y="874">Benchmarks, evaluation &amp; reliability</text>
    <rect x="443" y="846" width="334" height="45" rx="11" fill="#eaf3fb"/><text x="460" y="874">Reproducibility, governance &amp; biosafety</text>
  </g>

  <rect x="835" y="416" width="310" height="520" rx="25" fill="#ffffff" fill-opacity=".95" stroke="#8bbce0"/>
  <text x="990" y="462" text-anchor="middle" class="section">Call for papers</text>
  <text x="990" y="494" text-anchor="middle" class="sans muted" font-size="15">Full papers: up to 9 pages</text>
  <text x="990" y="516" text-anchor="middle" class="sans muted" font-size="15">Extended abstracts: up to 4 pages</text>
  <image href="qr-code.png" x="875" y="535" width="230" height="230" preserveAspectRatio="xMidYMid meet"/>
  <text x="990" y="793" text-anchor="middle" class="caps teal" font-size="14">SUBMISSION DEADLINE</text>
  <text x="990" y="829" text-anchor="middle" class="title navy" font-size="25">September 18, 2026</text>
  <text x="990" y="855" text-anchor="middle" class="sans teal" font-size="16" font-weight="700">Anywhere on Earth</text>
  <text x="990" y="881" text-anchor="middle" class="sans navy" font-size="14" font-weight="700">https://agenticls.github.io</text>
  <text x="990" y="902" text-anchor="middle" class="sans teal" font-size="11" font-weight="700">Submission link:</text>
  <text x="990" y="917" text-anchor="middle" class="sans muted" font-size="10">https://openreview.net/group?id=</text>
  <text x="990" y="931" text-anchor="middle" class="sans muted" font-size="10">NeurIPS.cc/2026/Workshop/AgenticLS</text>

  <text x="600" y="985" text-anchor="middle" class="section">Invited Speakers &amp; Panelists</text>
  <g fill="#fff" stroke="#16a4b5" stroke-width="4">
    <circle cx="118" cy="1110" r="61"/><circle cx="278" cy="1110" r="61"/><circle cx="438" cy="1110" r="61"/><circle cx="598" cy="1110" r="61"/>
    <circle cx="758" cy="1110" r="61"/><circle cx="918" cy="1110" r="61"/><circle cx="1078" cy="1110" r="61"/>
  </g>

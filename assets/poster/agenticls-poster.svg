  <image href="../photos/marinka-zitnik.jpg" x="697" y="1049" width="122" height="122" preserveAspectRatio="xMidYMin slice" clip-path="url(#p5)"/>
  <image href="../photos/eli-carrami.jpg" x="857" y="1049" width="122" height="122" preserveAspectRatio="xMidYMin slice" clip-path="url(#p6)"/>
  <image href="../photos/tommaso-biancalani.jpg" x="1017" y="1049" width="122" height="122" preserveAspectRatio="xMidYMin slice" clip-path="url(#p7)"/>
